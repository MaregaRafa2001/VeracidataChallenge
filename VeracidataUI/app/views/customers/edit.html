<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-4 col-md-6 col-sm-12">
            <div class="border rounded p-4 shadow-sm bg-white">
                <h2 class="mb-4 text-center">
                    <i class="fas fa-user-edit me-2"></i>Edit Customer
                </h2>

                <form name="vm.customerForm" ng-submit="vm.updateCustomer()" novalidate>
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            <i class="fas fa-user me-1"></i>Name
                        </label>
                        <input type="text" id="name" ng-model="vm.customer.name" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label for="nickname" class="form-label">
                            <i class="fas fa-user-tag me-1"></i>Nickname
                        </label>
                        <input type="text" id="nickname" ng-model="vm.customer.nickName" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">
                            <i class="fas fa-phone me-1"></i>Phone
                        </label>
                        <input type="text" id="phone" ng-model="vm.customer.phone" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label for="birthdate" class="form-label">
                            <i class="fas fa-calendar-alt me-1"></i>Birth Date
                        </label>
                        <input type="date" id="birthdate" ng-model="vm.customer.birthDate" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope me-1"></i>Email
                        </label>
                        <input type="email" id="email" ng-model="vm.customer.email" class="form-control" required />
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="active" ng-model="vm.customer.active" />
                        <label class="form-check-label" for="active">
                            Active
                        </label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>Update Customer
                        </button>
                        <button type="button" class="btn btn-secondary" ng-click="vm.cancel()">
                            <i class="fas fa-times me-1"></i>Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
