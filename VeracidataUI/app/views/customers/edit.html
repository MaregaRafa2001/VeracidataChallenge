<div class="container">
    <h2>Edit Customer</h2>

    <form name="customerForm" ng-submit="vm.updateCustomer()">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" ng-model="vm.customer.name" class="form-control" required />
        </div>

        <div class="form-group">
            <label for="nickname">NickName</label>
            <input type="text" id="nickname" ng-model="vm.customer.nickName" class="form-control" />
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" ng-model="vm.customer.phone" class="form-control" required />
        </div>

        <div class="form-group">
            <label for="birthdate">Birth Date</label>
            <input type="date" id="birthdate" ng-model="vm.customer.birthDate" class="form-control" />
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" ng-model="vm.customer.email" class="form-control" required />
        </div>

        <div class="form-group">
            <label for="active">Active</label>
            <input type="checkbox" id="active" ng-model="vm.customer.active" />
        </div>

        <div class="form-group">
            <button type="submit" class="btn btn-primary">Update Customer</button>
            <button type="button" class="btn btn-default" ng-click="vm.cancel()">Cancel</button>
        </div>
    </form>
</div>
