<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="fas fa-users me-2"></i>Customers</h2>
        <a href="#!/customers/create" class="btn btn-success">
            <i class="fas fa-user-plus me-1"></i>New Customer
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th><i class="fas fa-user me-1"></i>Name</th>
                    <th><i class="fas fa-envelope me-1"></i>Email</th>
                    <th><i class="fas fa-id-card me-1"></i>Phone</th>
                    <th class="text-end"><i class="fas fa-cogs me-1"></i>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="customer in vm.customers">
                    <td>{{ customer.name }}</td>
                    <td>{{ customer.email }}</td>
                    <td>{{ customer.phone }}</td>
                    <td class="text-end">
                        <a href="#!/customers/edit/{{customer.id}}" class="btn btn-sm btn-primary me-1">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <button class="btn btn-sm btn-danger" ng-click="vm.deleteCustomer(customer.id)">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </td>
                </tr>
                <tr ng-if="vm.customers.length === 0">
                    <td colspan="4" class="text-center text-muted">No customers found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
