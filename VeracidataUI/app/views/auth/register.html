<div class="container d-flex justify-content-center align-items-center vh-100" ng-controller="RegisterController as vm">
    <div class="col-lg-4 col-md-6 col-sm-12 border rounded p-4 shadow-sm bg-white">
        <h2 class="text-center mb-4">
            <i class="fas fa-user-plus me-2"></i>Register New User
        </h2>

        <form name="vm.registerForm" ng-submit="vm.register()" novalidate>
            <!-- Name -->
            <div class="form-group mb-3">
                <label><i class="fas fa-user me-2"></i>Name *</label>
                <input type="text" ng-model="vm.newUser.name" class="form-control" required />
            </div>

            <!-- Nickname -->
            <div class="form-group mb-3">
                <label><i class="fas fa-id-badge me-2"></i>Nickname</label>
                <input type="text" ng-model="vm.newUser.nickName" class="form-control" maxlength="100" />
            </div>

            <!-- Phone -->
            <div class="form-group mb-3">
                <label><i class="fas fa-phone me-2"></i>Phone *</label>
                <input type="tel" ng-model="vm.newUser.phone" class="form-control" required />
            </div>

            <!-- Birth Date -->
            <div class="form-group mb-3">
                <label><i class="fas fa-calendar-alt me-2"></i>Birth Date *</label>
                <input type="date" ng-model="vm.newUser.birthDate" class="form-control" required />
            </div>

            <!-- Email -->
            <div class="form-group mb-3">
                <label><i class="fas fa-envelope me-2"></i>Email *</label>
                <input type="email" ng-model="vm.newUser.email" class="form-control" required />
            </div>

            <!-- Password -->
            <div class="form-group mb-4">
                <label><i class="fas fa-lock me-2"></i>Password *</label>
                <input type="password" ng-model="vm.newUser.password" class="form-control" required />
            </div>

            <!-- Buttons -->
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-plus me-1"></i> Register
                </button>
                <button type="button" class="btn btn-secondary" ng-click="vm.cancel()">
                    <i class="fas fa-times me-1"></i> Cancel
                </button>
            </div>
        </form>
    </div>
</div>
