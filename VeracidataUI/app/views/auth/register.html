<div class="container">
    <h2>Register New User</h2>

    <form name="vm.registerForm" ng-submit="vm.register()" novalidate>
        <!-- Name -->
        <div class="form-group">
            <label>Name *</label>
            <input type="text" ng-model="vm.newUser.name" class="form-control" required>
        </div>

        <!-- NickName -->
        <div class="form-group">
            <label>Nickname</label>
            <input type="text" ng-model="vm.newUser.nickName" class="form-control" maxlength="100">
        </div>

        <!-- Phone -->
        <div class="form-group">
            <label>Phone *</label>
            <input type="tel" ng-model="vm.newUser.phone" class="form-control" required pattern="[0-9]{10,20}">
        </div>

        <!-- Birth Date -->
        <div class="form-group">
            <label>Birth Date *</label>
            <input type="date" ng-model="vm.newUser.birthDate" class="form-control" required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label>Email *</label>
            <input type="email" ng-model="vm.newUser.email" class="form-control" required>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label>Password *</label>
            <input type="password" ng-model="vm.newUser.password" class="form-control" required minlength="6">
        </div>

        <div class="form-group">
            <button type="submit" class="btn btn-primary">Register</button>
            <button type="button" class="btn btn-default" ng-click="vm.cancel()">Cancel</button>
        </div>
    </form>
</div>
