<div class="login-container" ng-controller="LoginController as vm">
    <h2>Login</h2>

    <form name="loginForm" ng-submit="vm.login()">
        <div class="form-group">
            <label>Email</label>
            <input type="email" ng-model="vm.credentials.email" class="form-control" required />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" ng-model="vm.credentials.password" class="form-control" required />
        </div>

        <div class="form-group">
            <button type="submit" class="btn btn-primary">Login</button>
            <button type="button" class="btn btn-secondary" ng-click="vm.goToRegister()">New User</button>
        </div>
    </form>
</div>
