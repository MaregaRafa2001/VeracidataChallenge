<div class="container d-flex justify-content-center align-items-center vh-100" ng-controller="LoginController as vm">
    <div class="col-lg-3 col-md-6 col-sm-12 border rounded p-4 shadow-sm bg-white">
        <h2 class="text-center mb-4"><i class="fas fa-sign-in-alt me-2"></i>Login</h2>

        <form name="loginForm" ng-submit="vm.login()">
            <div class="form-group mb-3">
                <label><i class="fas fa-envelope me-2"></i>Email</label>
                <input type="email" ng-model="vm.credentials.email" class="form-control" required />
            </div>

            <div class="form-group mb-4">
                <label><i class="fas fa-lock me-2"></i>Password</label>
                <input type="password" ng-model="vm.credentials.password" class="form-control" required />
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt me-1"></i> Login
                </button>
                <button type="button" class="btn btn-secondary" ng-click="vm.goToRegister()">
                    <i class="fas fa-user-plus me-1"></i> New User
                </button>
            </div>
        </form>
    </div>
</div>
